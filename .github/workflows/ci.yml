name: CI

on:
  pull_request:
  push:
    branches: [main, validation/vexo-2a-postgres, codex/validation-vexo-2a2-http-sandbox, codex/validation-vexo-2a3-mp-security]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Etapa 2 adds a real Postgres service so the RLS/multi-tenant isolation
# suite (tests/integration/rls-isolation.test.ts) runs against an actual
# database on every PR, not just statically-reviewed SQL — the same script
# (tests/integration/scripts/reset-test-db.sh) used for local development
# applies the test-only Supabase auth stub and every migration in
# supabase/migrations/ before the suite runs.
jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Placeholder values only — no real Supabase project is required to
      # lint, typecheck, test, or build. Never put a real secret in this
      # file (architecture §23).
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_STOREFRONT_DOMAIN_SUFFIX: vexo.local
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      TRIAL_HASH_SECRET: placeholder-trial-hash-secret-not-real
      # postgres:postgres@localhost is the standard, non-secret default for
      # the GitHub Actions postgres service — not a real credential.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vexo_test
      RUN_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency security audit
        run: npm audit --audit-level=moderate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate cart security migration rollout
        run: npm run db:test:cart-rollout

      - name: Reset test database (apply migrations)
        run: npm run db:test:reset

      - name: PostgreSQL integration tests
        run: npx vitest run tests/integration

      - name: Unit tests
        run: npx vitest run tests/unit

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      E2E_BROWSER_CHANNEL: chrome
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3100
      NEXT_PUBLIC_STOREFRONT_DOMAIN_SUFFIX: vexo.local
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      TRIAL_HASH_SECRET: placeholder-trial-hash-secret-not-real
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The runner image includes Chrome and its OS dependencies. Use the
      # supported Playwright channel and record the actual browser version.
      - name: Verify installed Chrome
        run: google-chrome --version

      - name: Public smoke tests
        run: npm run test:e2e

  supabase-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_BROWSER_CHANNEL: chrome
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pinned action commit plus an explicit CLI version: the runner starts
      # only a disposable local stack. No Supabase access token, project ref,
      # linked project, or production secret is available to this job.
      - uses: supabase/setup-cli@bea637206310b05056109c4ffab256b2c3c522af
        with:
          version: 2.115.0

      - name: Start isolated Supabase Auth and PostgREST
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase start \
            --exclude studio,realtime,storage-api,imgproxy,postgres-meta,mailpit,edge-runtime,logflare,vector,supavisor \
            >"$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "The isolated Supabase stack failed to start. Output was withheld because the CLI includes local API keys."
            exit 1
          fi
          echo "Isolated Supabase Auth and PostgREST started; credential-bearing CLI output was withheld."

      - name: Real HTTP Auth, PostgREST and checkout tests
        run: npm run test:http:supabase

      - name: Verify installed Chrome for isolated commerce flow
        run: google-chrome --version

      - name: Browser to database commerce tests (desktop, Pixel 7, 360 px)
        run: npm run test:e2e:supabase

      # Only disposable loopback fixtures are used by this job. Do not
      # include environment files, CLI credential output or production data.
      - name: Save isolated browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: isolated-browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop isolated Supabase stack
        if: always()
        run: supabase stop --no-backup
